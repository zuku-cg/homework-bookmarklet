<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarklet test page (made-up data)</title>
<style>body{font:16px system-ui;padding:24px;background:#fff7f7} h1{color:#900} button{font:inherit;padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<h1>Pretend school page</h1>
<p>This stands in for DPR. The homework below is made up. Nothing here talks to DPR.</p>
<p><button id="run">Run the bookmarklet</button><button id="logout">Pretend to be logged out</button><span id="log"></span></p>
<script>
  // Made-up data in the shape DPR's student API returns, with dates relative to today.
  window.__HWB_TEST__ = true;
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10) + " 00:00:00"; };
  const hw = (id, cls, subject, title, set, due, mins, method, extra = {}) => ({
    id, status: null, grade: null, student_check: false, viewed_date: null, feedback: [], ...extra.top,
    assignment: { id: id + 5000, title: `${cls} - ${title} - Due ${day(due).slice(8, 10)}.${day(due).slice(5, 7)}.${day(due).slice(2, 4)}`,
      description_text: extra.desc || "", type: "Consolidating Learning", submission_method: method,
      issue_date: day(set), end_date: day(due), duration_length: mins, duration_unit: "minutes",
      attachments: extra.att || [], school_class: { class_name: cls, subject_area: { subject_area: subject } } },
  });
  let data = [
    hw(101, "7X/Ma1", "Maths", "Fractions quiz", -6, -1, 20, "Submit via Sparx Maths"),
    hw(102, "7X/En2", "English", "Read chapter 3 and answer the questions", -2, 0, 30, "Hand in class", { desc: "Questions are on page 41.\nHelp: https://example.org/chapter-3" }),
    hw(103, "7X/Sc1", "Science / Biology", "Label the plant cell <b>diagram</b>", -1, 3, 25, "Hand in class", { att: [{ id: 1, url: "https://s3.dpr.education/files/Plant_cell+worksheet.pdf" }] }),
    hw(104, "7X/Hi1", "History", "1066 timeline", -1, 6, 40, "Submit Online"),
    hw(105, "7X/Ar1", "Art", "Shading practice", 0, 12, 30, "Hand in class"),
    hw(106, "7X/Ge1", "Geography", "Map symbols", -9, -4, 15, "Hand in class", { top: { student_check: true } }),
    hw(107, "7 Tutor", "Other", "Join the form quiz", -1, 1, 5, "Submit Online"),
  ];
  let loggedIn = true;
  const log = m => (document.getElementById("log").textContent = m);
  const json = (body, status = 200) => new Response(typeof body === "string" ? body : JSON.stringify(body), { status });
  window.fetch = async (url, opts = {}) => {
    await new Promise(r => setTimeout(r, 250));
    if (!loggedIn) return json("<html><body>login page</body></html>");
    if (String(url).startsWith("/api/student/assignment-students/me")) return json(data);
    const m = String(url).match(/^\/api\/student\/assignment-students\/(\d+)$/);
    if (m && opts.method === "PATCH") {
      const item = data.find(d => d.id === Number(m[1]));
      item.student_check = !!JSON.parse(opts.body).student_check;
      log(`PATCH ${m[1]} ${opts.body}`);
      return json("");
    }
    return json({ error: "unexpected request " + url }, 500);
  };
  document.getElementById("logout").onclick = () => { loggedIn = !loggedIn; log(loggedIn ? "logged in" : "logged out"); };
  document.getElementById("run").onclick = () => {
    const s = document.createElement("script");
    s.src = "../dist/bookmarklet.js?" + Date.now();
    document.body.appendChild(s);
  };
</script>
</body>
</html>
